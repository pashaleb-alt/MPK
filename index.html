      const lab = a.slice(5,7)===b.slice(5,7) ? `${da}–${db} ${MG[+b.slice(5,7)-1]}` : `${da} ${MG[+a.slice(5,7)-1]} – ${db} ${MG[+b.slice(5,7)-1]}`;
      return {n, from:a, to:b, lab}; }); })();
const MONTHS = MONS.map(name=>{ const rs=DATA[name].filter(r=>r.d<=LAST); return {name, from:rs[0].d, to:rs[rs.length-1].d,
  has: rs.some(r=>r.ubl&&r.ubl[1]!=null)}; }).filter(m=>m.has);

let mode = "day", mon = MONS[MONS.length-1], day = null;
let week = WEEKS[WEEKS.length-1].n, moSel = MONTHS[MONTHS.length-1].name, pfrom = null, pto = null;

const nf = (v,d=0)=> v==null ? "—" :
  v.toLocaleString("ru-RU",{minimumFractionDigits:d,maximumFractionDigits:d});
const pctOf = (p,f)=> (p&&f!=null) ? f/p*100 : null;
function status(m, p, f){
  if(m.mode==="stock"){ if(p==null) return "none"; return p<80?"good":p<90?"warn":"crit"; }
  if(m.abs){ if(f==null) return "none"; return f<m.abs[0]?"crit":f<m.abs[1]?"warn":"good"; }
  const r = pctOf(p,f);
  if(r==null) return (m.mode==="pct" && !m.inv && !p && f>0) ? "good" : "none";   // сверх плана при нулевом плане
  if(m.inv) return r<=100?"good":r<120?"warn":"crit";
  const b = m.bands || [90, 98];
  return r<b[0]?"crit":r<b[1]?"warn":"good";
}
function primary(m, rec){
  const [p,f] = rec[m.k]||[null,null];
  if(m.mode==="stock"){ const pc = f==null?null:(f<=1.5?f*100:f); return {num:pc, plan:CAP, fact:p}; }
  if(m.mode==="val") return {num:f, plan:p, fact:f};
  return {num:pctOf(p,f), plan:p, fact:f};
}
function rangeRows(){ return mode==="day" ? DATA[mon] : ALL.filter(r=>r.d>=pfrom && r.d<=pto); }
function seriesOf(m){
  return rangeRows().map(r=>{
    const q = primary(m,r);
    return {d:r.d, v:q.num, st:status(m, m.mode==="stock"?q.num:q.plan, m.mode==="stock"?null:q.fact)};
  });
}
function sparkline(m, sel){
  const all = seriesOf(m), pts = all.filter(x=>x.v!=null);
  if(pts.length<2) return '<svg class="spark" aria-hidden="true"></svg>';
  const W=240, H=38, PAD=5;
  const vs = pts.map(x=>x.v), lo=Math.min(...vs), hi=Math.max(...vs), span=(hi-lo)||1;
  const xs = i => PAD + i*(W-2*PAD)/(pts.length-1);
  const ys = v => H-PAD - (v-lo)/span*(H-2*PAD);
  const dpath = pts.map((x,i)=>(i?"L":"M")+xs(i).toFixed(1)+" "+ys(x.v).toFixed(1)).join(" ");
  const si = pts.findIndex(x=>x.d===sel);
  const dot = si>=0 ? `<circle class="sel" cx="${xs(si).toFixed(1)}" cy="${ys(pts[si].v).toFixed(1)}" r="3.8"></circle>` : "";
  const hits = pts.map((x,i)=>
    `<rect x="${(xs(i)-5).toFixed(1)}" y="0" width="10" height="${H}" fill="transparent" data-d="${x.d}"><title>${+x.d.slice(8,10)} ${MG[+x.d.slice(5,7)-1]} — ${nf(x.v,1)}</title></rect>`).join("");
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Динамика">
    <path d="${dpath}" fill="none" stroke="var(--spark)" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"></path>${dot}${hits}</svg>`;
}

const mean = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : null;
function aggregate(from,to){
  const rs = ALL.filter(r=>r.d>=from && r.d<=to);
  const out = {}, withFact = rs.filter(r=>r.ubl && r.ubl[1]!=null);
  for(const m of METRICS){
    const k = m.k;
    if(m.mode==="pct"){
      const p = rs.reduce((a,r)=>a+(r[k][0]||0),0), f = rs.reduce((a,r)=>a+(r[k][1]||0),0);
      out[k] = [p||null, rs.some(r=>r[k][1]!=null)?f:null];
    } else if(m.mode==="val"){
      const fs = rs.filter(r=>r[k][1]!=null);
      out[k] = [k==="us" ? 98 : mean(fs.map(r=>r[k][0]).filter(v=>v!=null)), mean(fs.map(r=>r[k][1]))];
    } else {
      const lastSk = rs.filter(r=>r.sk && r.sk[1]!=null).slice(-1)[0];
      out[k] = lastSk ? lastSk.sk : [null,null];
    }
  }
  out.n = withFact.length; out.d = to;
  return out;
}
const fmtD = d => new Date(d).toLocaleDateString("ru-RU",{day:"numeric",month:"long"});
const addDays = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x.toISOString().slice(0,10); };
const PRESETS = [
  ["7 дней",   ()=>[addDays(LAST,-6), LAST]],
  ["14 дней",  ()=>[addDays(LAST,-13), LAST]],
  ["30 дней",  ()=>[addDays(LAST,-29), LAST]],
  ["с начала месяца", ()=>[LAST.slice(0,8)+"01", LAST]],
  ["с начала года",   ()=>[FIRST, LAST]],
];

function rowHtml(m, q, agg, sel){
  const st = status(m, m.mode==="stock"?q.num:q.plan, m.mode==="stock"?null:q.fact);
  const shown = q.num, scale = m.mode==="stock" ? 100 : 140;
  const over = m.mode==="pct" && !m.inv && shown==null && !q.plan && q.fact>0;      // сверх плана
  // ширина шкалы: для «% плана» — сам процент на шкале 0–140; для показателей «по значению» — так же, как в картинке:
  // средний вес — факт к плану в %; выход и уровень сервиса — положение в окне (низ, верх), риска на пороге
  const WIN = {vyh:[71,79,75.39], us:[90,100,98]};
  let w, refPos = 100/scale*100;
  if(shown==null) w = over?100:0;
  else if(m.mode==="val" && WIN[m.k]){ const [lo,hi,rf]=WIN[m.k]; w=Math.max(1.5, Math.min(Math.max((shown-lo)/(hi-lo),0),1)*100); refPos=(rf-lo)/(hi-lo)*100; }
  else if(m.mode==="val"){ const r=pctOf(q.plan,q.fact); w = r==null?0:Math.max(1.5, Math.min(r,scale)/scale*100); }
  else w = Math.max(1.5, Math.min(shown,scale)/scale*100);
  const sub = m.mode==="stock" ? `${nf(CAP)} / ${nf(q.fact,0)} т${agg?" на "+fmtD(agg.d):""}`
            : m.mode==="val"   ? `${agg?"в среднем ":""}${nf(q.plan, m.dec||0)} / ${nf(q.fact, m.dec||0)} ${m.u}`
            : over             ? `план не задан · сверх плана`
            :                    `${nf(q.plan, 0)} / ${nf(q.fact, 0)} ${m.u}${agg?" за период":""}`;
  const numTxt = shown==null
    ? (m.mode==="pct" && q.fact!=null ? nf(q.fact,0)+`<i> ${m.u}</i>` : "—")
    : (m.mode==="val" ? nf(shown,m.dec||1)+`<i> ${m.u}</i>` : nf(shown,0)+"<i>%</i>");
  const ref = m.mode==="stock" ? "" : `<div class="ref" style="left:${refPos.toFixed(1)}%"></div>`;
  return `<div class="row st-${st}">
    <div class="nm">${m.n}<span>${sub}</span></div>
    <div class="val">${numTxt}</div>
    <div class="track"><div class="fill" style="width:${w.toFixed(1)}%"></div>${ref}</div>
    ${sparkline(m, sel)}
  </div>`;
}

function renderRange(from, to, header){
  pfrom = from; pto = to;
  const agg = aggregate(from, to);
  document.getElementById("cur").textContent = header + " · " + agg.n + " дн. с данными";

function render(){
  const warn = document.getElementById("pwarn"); warn.hidden = true;
  if(FULL&&typeof renderLabor==="function") setTimeout(renderLabor,0);

  document.getElementById("daynav").hidden = mode!=="day";
  if(mode==="week"){
    const w = WEEKS.find(x=>x.n===week) || WEEKS[WEEKS.length-1]; week = w.n;
    document.getElementById("weekchips").innerHTML = [...WEEKS].reverse().map(x=>
      `<button class="wchip" data-w="${x.n}" aria-pressed="${x.n===week}"><b>${x.n}</b><span>${x.lab}</span></button>`).join("");
    renderRange(w.from, w.to, `Неделя ${w.n} · ${fmtD(w.from)} — ${fmtD(w.to)}`); return;
  }
  if(mode==="month"){
    const mo = MONTHS.find(x=>x.name===moSel) || MONTHS[MONTHS.length-1]; moSel = mo.name;
    document.getElementById("monthchips").innerHTML = [...MONTHS].reverse().map(x=>

    renderRange(mo.from, mo.to, `${mo.name}${part}`); return;
  }
  if(mode==="year"){ renderRange(FIRST, LAST, `2026 год · ${fmtD(FIRST)} — ${fmtD(LAST)}`); return; }
  if(mode==="per"){
    if(!pfrom || !pto || mode!=="per"){ [pfrom,pto] = PRESETS[2][1](); }
    if(pfrom > pto){ [pfrom,pto] = [pto,pfrom]; }
    if(pfrom < FIRST) pfrom = FIRST;
    if(pto > LAST){ pto = LAST; warn.textContent = "Данные есть по " + fmtD(LAST) + " — конец периода сдвинут."; warn.hidden = false; }
    document.getElementById("from").value = pfrom; document.getElementById("to").value = pto;
    renderRange(pfrom, pto, `${fmtD(pfrom)} — ${fmtD(pto)}`); return;
  }
  // режим «Дни»
  const days = DATA[mon];
  if(!day || !days.some(r=>r.d===day)){
    const filled = days.filter(r=>r.ubl && r.ubl[1]!=null);

  document.getElementById("monchips").innerHTML = [...MONS].reverse().map(m=>
    `<button class="mon" data-m="${m}" aria-pressed="${m===mon}">${m}</button>`).join("");
  const rec = days.find(r=>r.d===day);

    dt.toLocaleDateString("ru-RU",{day:"numeric",month:"long"}) + ", " + dt.toLocaleDateString("ru-RU",{weekday:"long"});

  document.getElementById("days").innerHTML = ordered.map(r=>{
    const has = r.ubl && r.ubl[1]!=null;
    return `<button class="day" data-d="${r.d}" ${has?"":"data-empty"} aria-pressed="${r.d===day}">${new Date(r.d).getDate()}</button>`;
  }).join("");
  document.getElementById("rows").innerHTML = METRICS.map(m=>rowHtml(m, primary(m,rec), null, day)).join("");
  const idx = days.findIndex(r=>r.d===day);
  document.getElementById("prev").disabled = idx<=0;
  document.getElementById("next").disabled = idx>=days.length-1;
}

    const pts=ser.map(([m,x])=>[X(m),Y(x.val),m,x.val]);
    let path=""; pts.forEach((p,i)=>{ if(!i){path="M"+p[0].toFixed(1)+" "+p[1].toFixed(1);return}
      const p0=pts[i-1],p1=p,pm=pts[i-2]||p0,pn=pts[i+1]||p1,t=0.2;
      path+=` C${(p0[0]+(p1[0]-pm[0])*t).toFixed(1)} ${(p0[1]+(p1[1]-pm[1])*t).toFixed(1)} ${(p1[0]-(pn[0]-p0[0])*t).toFixed(1)} ${(p1[1]-(pn[1]-p0[1])*t).toFixed(1)} ${p1[0].toFixed(1)} ${p1[1].toFixed(1)}`});
    const area=path+` L${pts[pts.length-1][0].toFixed(1)} ${(H-pb).toFixed(1)} L${pts[0][0].toFixed(1)} ${(H-pb).toFixed(1)} Z`;
    const dots=pts.map(([x,y,m,v])=>`<g class="pt${selM===m?" sel":""}" data-m="${m}"><circle class="hit" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="14"/><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${selM===m?6:5}"/><text x="${x.toFixed(1)}" y="${(y-(MOB?11:13)).toFixed(1)}" text-anchor="middle" class="${MOB?"m":""}">${fx(v,v<10?2:1)}</text><title>${MN[m-1]}: ${fx(v,2)} ${unit}</title></g>`).join("");
    const xl=Array.from({length:12},(_,i)=>`<text x="${X(i+1).toFixed(1)}" y="${H-4}" text-anchor="middle" class="x ${MOB?"m ":""}${selM===i+1?"sel":""}${LABOR[i+1]&&LABOR[i+1][k]?"":" no"}">${MG[i]}</text>`).join("");
    box.insertAdjacentHTML("beforeend",`<div class="lb-one"><div class="lb-head"><h3>${nm}</h3>${head}</div><svg class="lb-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="${nm}, ${unit} по месяцам"><path class="area" d="${area}"/><path class="line" d="${path}"/>${dots}${xl}</svg></div>`)});
  box.querySelectorAll(".lb-svg .pt").forEach(c=>c.onclick=()=>{const m=+c.dataset.m; if(MONS[m-1]){mode="month"; moSel=MONS[m-1]; render()}});
}
render();
let _rw=window.innerWidth<720; window.addEventListener("resize",()=>{const m=window.innerWidth<720; if(m!==_rw){_rw=m; render()}});
</script>
