<title>Дневник питания</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Раскладка: одна колонка, как этикетка продукта. Сверху итог дня,
   ниже выбор приёма пищи, плитки частых продуктов и журнал дня. */
:root {
  --bg: #eef1ea;
  --surface: #fbfcf8;
  --ink: #17201b;
  --muted: #5b675f;
  --line: #d2d9cd;
  --protein: #1e7a4c;
  --kcal: #2f52a3;
  --warn: #b1481a;
  --on-ink: #fbfcf8;
  --f-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1512; --surface: #172019; --ink: #e8eee7; --muted: #94a199; --line: #28352d;
    --protein: #4cc38a; --kcal: #84a6f2; --warn: #ec8f5e; --on-ink: #0f1512;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1512; --surface: #172019; --ink: #e8eee7; --muted: #94a199; --line: #28352d;
  --protein: #4cc38a; --kcal: #84a6f2; --warn: #ec8f5e; --on-ink: #0f1512;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.4;
  padding-block: 16px 96px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--kcal); outline-offset: 2px; }
.app { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.num { font-variant-numeric: tabular-nums; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.eyebrow { font: 700 12px/1 var(--f-display); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.ghost { background: none; border: 1.5px solid var(--ink); border-radius: 999px; padding: 8px 14px; min-height: 40px; font-weight: 500; }
.ghost[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); }

.datebar { display: grid; grid-template-columns: 48px 1fr 48px; align-items: center; gap: 8px; }
.datebar h1 { margin: 0; text-align: center; font: 800 26px/1.1 var(--f-display); text-wrap: balance; }
.datebar h1 small { display: block; margin-top: 2px; font: 500 13px var(--f-body); color: var(--muted); }
.arrow { height: 48px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); font-size: 22px; line-height: 1; }
.arrow:disabled { opacity: .35; cursor: default; }

.label { background: var(--surface); border: 2px solid var(--ink); padding: 12px 14px 14px; }
.label h2 { margin: 0 0 6px; font: 800 20px/1.1 var(--f-display); }
.label .thick { height: 7px; background: var(--ink); margin-bottom: 4px; }
.row { padding: 8px 0 7px; border-top: 1px solid var(--line); }
.row:first-of-type { border-top: 0; }
.row .head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.row .name { font-weight: 600; }
.row .val { font: 700 18px/1 var(--f-display); }
.row .val span { font: 500 13px var(--f-body); color: var(--muted); }
.row.sub .name { font-weight: 400; }
.row.sub .val { font-size: 15px; }
.track { height: 7px; background: var(--line); margin-top: 6px; }
.fill { height: 100%; background: var(--ink); }
.fill.kcal { background: var(--kcal); }
.fill.protein { background: var(--protein); }
.fill.over { background: var(--warn); }
.left { margin: 10px 0 0; font-weight: 600; }
.left .over { color: var(--warn); }

.meals { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.meal { min-height: 46px; border: 1.5px solid var(--ink); background: var(--surface); border-radius: 10px; font-weight: 600; padding: 4px; }
.meal[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); }

.repeat { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; width: 100%; min-height: 56px;
  background: var(--surface); border: 1.5px dashed var(--ink); border-radius: 10px; padding: 10px 14px; }
.repeat b { font-family: var(--f-display); }
.repeat span { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }

.picker { display: flex; flex-direction: column; gap: 10px; }
.picker-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.picker-head h2, .log h2, .week h2 { margin: 0; font: 800 18px/1.1 var(--f-display); }
.btns { display: flex; gap: 8px; }
.search { width: 100%; min-height: 46px; border: 1.5px solid var(--line); background: var(--surface); border-radius: 10px; padding: 0 14px; }
.chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.chip { position: relative; text-align: left; min-width: 0; min-height: 76px; background: var(--surface); border: 1.5px solid var(--line);
  border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; }
.chip:active { border-color: var(--ink); }
.chip .n { font-weight: 600; overflow-wrap: anywhere; line-height: 1.2; padding-right: 22px; }
.chip .p { color: var(--muted); font-size: 13px; }
.chip .m { margin-top: auto; font-size: 13px; color: var(--muted); }
.chip .m b { color: var(--protein); font-weight: 600; }
.chip .badge { position: absolute; top: 8px; right: 8px; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 11px; background: var(--ink); color: var(--on-ink); font: 700 12px/22px var(--f-display); text-align: center; }
.chip .pen { position: absolute; top: 8px; right: 10px; color: var(--muted); }
.more { background: none; border: 0; text-decoration: underline; color: var(--muted); min-height: 40px; align-self: flex-start; padding: 0; }
.empty { color: var(--muted); padding: 14px; border: 1.5px dashed var(--line); border-radius: 10px; }

.log { display: flex; flex-direction: column; gap: 14px; }
.mealblock { background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px; }
.mealblock > header { display: flex; justify-content: space-between; align-items: baseline; padding: 10px 14px; border-bottom: 1.5px solid var(--ink); }
.mealblock > header b { font: 800 16px var(--f-display); }
.mealblock > header span { font-size: 13px; color: var(--muted); }
.entry { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; padding: 10px 14px; border-top: 1px solid var(--line); align-items: center; }
.entry:first-of-type { border-top: 0; }
.entry .t { min-width: 0; overflow-wrap: anywhere; font-weight: 500; }
.entry .t small { display: block; color: var(--muted); font-weight: 400; font-size: 13px; }
.entry .s { display: inline-flex; align-items: center; border: 1.5px solid var(--line); border-radius: 10px; overflow: hidden; }
.entry .s button { width: 40px; height: 40px; border: 0; background: none; font-size: 20px; line-height: 1; }
.entry .s output { min-width: 36px; text-align: center; font: 700 15px var(--f-display); }
.empty-meal { padding: 12px 14px; color: var(--muted); font-size: 14px; }

.week { display: flex; flex-direction: column; gap: 8px; }
.days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.day { background: var(--surface); border: 1.5px solid var(--line); border-radius: 8px; padding: 6px 2px 6px; display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
.day[aria-pressed="true"] { border-color: var(--ink); border-width: 2px; }
.day .bar { width: 14px; height: 56px; background: var(--line); display: flex; align-items: flex-end; position: relative; }
.day .bar i { display: block; width: 100%; background: var(--kcal); }
.day .bar i.over { background: var(--warn); }
.day .bar::after { content: ""; position: absolute; left: -3px; right: -3px; top: 0; border-top: 1.5px solid var(--ink); }
.day .w { font-size: 12px; color: var(--muted); }
.day .k { font: 700 12px var(--f-display); }
.day .pr { font-size: 11px; color: var(--protein); }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: min(calc(100% - 32px), 420px);
  background: var(--ink); color: var(--on-ink); border-radius: 10px; padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; gap: 12px; z-index: 20; }
.toast button { background: none; border: 0; color: inherit; text-decoration: underline; font-weight: 600; min-height: 36px; }

.sheet { position: fixed; inset: 0; z-index: 30; background: rgba(10, 14, 11, .55); display: flex; align-items: flex-end; justify-content: center; }
.panel { width: 100%; max-width: 560px; max-height: 92%; overflow-y: auto; background: var(--surface); border-top: 3px solid var(--ink); border-radius: 14px 14px 0 0;
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.panel h2 { margin: 0 0 12px; font: 800 20px var(--f-display); }
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.fields .wide { grid-column: 1 / -1; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label { font-size: 13px; color: var(--muted); }
.field textarea { border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--bg); width: 100%; resize: vertical; }
.field input { min-height: 46px; border: 1.5px solid var(--line); border-radius: 10px; padding: 0 12px; background: var(--bg); width: 100%; }
.actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
.primary { flex: 1; min-height: 48px; background: var(--ink); color: var(--on-ink); border: 0; border-radius: 10px; font-weight: 600; padding: 0 16px; }
.danger { min-height: 48px; background: none; border: 1.5px solid var(--warn); color: var(--warn); border-radius: 10px; padding: 0 14px; font-weight: 600; }
.plain { min-height: 48px; background: none; border: 1.5px solid var(--line); border-radius: 10px; padding: 0 14px; }
.note { margin: 10px 0 0; font-size: 13px; color: var(--muted); }
@media (prefers-reduced-motion: no-preference) { .fill, .day .bar i { transition: width .25s, height .25s; } }
</style>
</head>

  </div>
  <section class="label" id="summary" aria-live="polite"></section>
  <div class="meals" id="meals" role="group" aria-label="Приём пищи"></div>
  <div id="repeat"></div>
  <section class="picker">
    <div class="picker-head">
      <h2>Что съели</h2>

      </div>

    <input class="search" id="search" type="search" placeholder="Найти продукт" autocomplete="off" aria-label="Найти продукт">

  <section class="log"><h2>Журнал дня</h2><div id="log" style="display:flex;flex-direction:column;gap:14px"></div></section>
  <section class="week"><h2>Последние 7 дней</h2><div class="days" id="week"></div></section>
</div>
<div class="toast" id="toast" hidden></div>
<div class="sheet" id="sheet" hidden></div>

  function snapDoc(id, data) { return { id: id, exists: true, data: function () { return clone(data); }, metadata: { fromCache: false, hasPendingWrites: false } }; }
  function colDocs(path, q) {
    var out = [], pre = path + "/";
    Object.keys(store.docs).forEach(function (k) {
      if (k.indexOf(pre) === 0 && k.slice(pre.length).indexOf("/") < 0) out.push(snapDoc(k.slice(pre.length), store.docs[k]));
    });
    if (q.field) out.sort(function (a, b) {
      var x = a.data()[q.field], y = b.data()[q.field];
      return (x < y ? -1 : x > y ? 1 : 0) * (q.dir === "desc" ? -1 : 1);

    return { docs: out, size: out.length, empty: !out.length };
  }
  function fire(l) {
    if (l.kind === "col") l.fn(colDocs(l.path, l.q));
    else l.fn(store.docs[l.path] ? snapDoc(l.path.split("/").pop(), store.docs[l.path]) : { id: l.path.split("/").pop(), exists: false, data: function () { return undefined; } });
  }
  function notify(path) {
    var parent = path.slice(0, path.lastIndexOf("/"));
    listeners.forEach(function (l) { if (l.path === path || l.path === parent) fire(l); });
  }
  function sub(l) { listeners.push(l); setTimeout(function () { fire(l); }, 0); return function () { listeners = listeners.filter(function (x) { return x !== l; }); }; }
  function query(path, q) {
    return {
      orderBy: function (f, d) { return query(path, { field: f, dir: d || "asc", limit: q.limit }); },
      limit: function (n) { return query(path, { field: q.field, dir: q.dir, limit: n }); },
      onSnapshot: function (fn) { return sub({ kind: "col", path: path, q: q, fn: fn }); }

  window.__localDb = {
    doc: function (path) {
      return {
        set: function (data) { store.docs[path] = clone(data); save(); notify(path); return Promise.resolve(); },
        delete: function () { delete store.docs[path]; save(); notify(path); return Promise.resolve(); },
        onSnapshot: function (fn) { return sub({ kind: "doc", path: path, fn: fn }); }
      };
    },
    collection: function (path) { return query(path, {}); },
    exportJSON: function () { return JSON.stringify(store); },
    importJSON: function (text) {
      try {
        var o = JSON.parse(text);
        if (o && o.docs) { store = o; save(); return true; }
        if (o && o.days) {  // компактная история: {"days": {"ГГГГ-ММ-ДД": [[приём, id продукта, количество, ккал, белок, жиры, углеводы?], ...]}}
          Object.keys(o.days).forEach(function (date) {
            var entries = o.days[date].map(function (r, n) {
              var f = store.docs["foods/" + r[1]]; if (!f) return null;
              var ov = r.length > 3;
              return { id: "h" + date.slice(-2) + n, foodId: r[1], name: f.name, portion: f.portion || "", meal: r[0], qty: r[2],
                       kcal: ov ? r[3] : f.kcal, p: ov ? r[4] : f.p, f: ov ? r[5] : f.f, c: ov ? r[6] : f.c, t: Date.UTC(2026, 0, 1) + n };
            }).filter(Boolean);
            store.docs["days/" + date] = { date: date, entries: entries };
          });
          save(); return true;
        }
        return false;
      } catch (e) { return false; }
    }
  };
})();

</script>
<script>
(function () {
  var MEALS = [["b", "Завтрак"], ["l", "Обед"], ["s", "Перекус"], ["d", "Ужин"]];
  var DEF_T = { kcal: 2200, p: 135, f: 70, c: 258 };
  var WD = ["вс", "пн", "вт", "ср", "чт", "пт", "сб"];
  var MON = ["янв", "фев", "мар", "апр", "мая", "июн", "июл", "авг", "сен", "окт", "ноя", "дек"];
  var db = null;
  var wr = {};
  var toastTimer = null;

  function iso(d) { var z = function (n) { return String(n).padStart(2, "0"); }; return d.getFullYear() + "-" + z(d.getMonth() + 1) + "-" + z(d.getDate()); }

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

  var S = { foods: {}, days: {}, targets: clone(DEF_T), date: iso(new Date()), meal: defMeal(),

  function h(tag, props) {

  }
  var $ = function (id) { return document.getElementById(id); };

  /* ---------- данные ---------- */
  function dayEntries(date) { return S.days[date] || []; }
  function totals(list) {
    var t = { kcal: 0, p: 0, f: 0, c: 0 };
    list.forEach(function (e) { t.kcal += e.kcal * e.qty; t.p += e.p * e.qty; t.f += e.f * e.qty; t.c += e.c * e.qty; });

  }

    if (parts[0] === "days") return { date: parts[1], entries: clone(S.days[parts[1]] || []) };
    return clone(S.targets);
  }
  function persist(path) {
    if (!db) return;
    var s = wr[path] || (wr[path] = { busy: false, dirty: false });

    if (s.busy) return;
    s.busy = true;
    (async function () {

        s.dirty = false;
        try {
          var d = dataFor(path);
          if (d === null) await db.doc(path).delete(); else await db.doc(path).set(d);

        } catch (e) {
          S.error = "Не удалось сохранить. Проверьте связь и повторите действие.";
          render();
        }

      s.busy = false;
    })();
  }

  function addFood(id, qty, meal) {
    var f = S.foods[id]; if (!f) return;
    meal = meal || S.meal;
    var date = S.date;
    var prev = JSON.stringify(dayEntries(date));
    var list = clone(dayEntries(date));
    var e = list.find(function (x) { return x.foodId === id && x.meal === meal; });
    if (e) e.qty = r1(e.qty + qty);
    else list.push({ id: uid(), foodId: id, name: f.name, portion: f.portion || "", meal: meal, qty: qty,
                     kcal: f.kcal, p: f.p, f: f.f, c: f.c, t: Date.now() });
    S.days[date] = list;
    f.uses = (f.uses || 0) + 1; f.last = Date.now();
    persist("days/" + date); persist("foods/" + id);
    render();
    toast("Добавлено: " + f.name, function () {
      S.days[date] = JSON.parse(prev); persist("days/" + date); render();
    });
  }
  function changeQty(entryId, delta) {
    var list = clone(dayEntries(S.date));
    var i = list.findIndex(function (x) { return x.id === entryId; });
    if (i < 0) return;
    var q = r1(list[i].qty + delta);
    if (q <= 0) list.splice(i, 1); else list[i].qty = q;
    S.days[S.date] = list;
    persist("days/" + S.date); render();
  }
  function repeatMeal(fromDate) {
    var date = S.date, meal = S.meal;
    var prev = JSON.stringify(dayEntries(date));
    var src = dayEntries(fromDate).filter(function (e) { return e.meal === meal; });
    var list = clone(dayEntries(date));
    src.forEach(function (e) {
      var n = clone(e); n.id = uid(); n.t = Date.now(); list.push(n);
      if (S.foods[e.foodId]) { S.foods[e.foodId].uses = (S.foods[e.foodId].uses || 0) + 1; S.foods[e.foodId].last = Date.now(); persist("foods/" + e.foodId); }
    });
    S.days[date] = list; persist("days/" + date); render();
    toast("Повторено: " + src.length + " поз.", function () { S.days[date] = JSON.parse(prev); persist("days/" + date); render(); });
  }

  /* ---------- уведомление ---------- */
  function toast(text, undo) {
    var t = $("toast");
    t.replaceChildren(h("span", null, text), undo ? h("button", { type: "button", onclick: function () { undo(); hideToast(); } }, "Отменить") : null);
    t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, 4500);
  }
  function hideToast() { $("toast").hidden = true; }

  /* ---------- отрисовка ---------- */
  function dayTitle(date) {
    var today = iso(new Date());
    if (date === today) return "Сегодня";
    if (date === addDays(today, -1)) return "Вчера";
    var d = parse(date); return WD[d.getDay()] + ", " + d.getDate() + " " + MON[d.getMonth()];
  }
  function renderHead() {
    var d = parse(S.date);
    var big = dayTitle(S.date);
    var small = d.getDate() + " " + MON[d.getMonth()] + " " + d.getFullYear();
    var el = $("dlabel"); el.replaceChildren(big, h("small", null, small));
    $("next").disabled = S.date >= iso(new Date());
  }
  function row(cls, name, val, target, unit, kind, capOver) {
    var ratio = target ? val / target : 0;
    var over = capOver && ratio > 1.0;
    return h("div", { class: "row" + (cls ? " " + cls : "") },
      h("div", { class: "head" },
        h("span", { class: "name" }, name),
        h("span", { class: "val num" }, fmt(val, unit === "г" ? 1 : 0), h("span", null, " / " + fmt(target) + " " + unit))),
      h("div", { class: "track" }, h("div", { class: "fill " + kind + (over ? " over" : ""), style: "width:" + Math.min(100, ratio * 100) + "%" })));
  }
  function renderSummary() {
    var t = totals(dayEntries(S.date)), g = S.targets;
    var leftK = Math.round(g.kcal - t.kcal), leftP = Math.round((g.p - t.p) * 10) / 10;
    var s = $("summary");
    s.replaceChildren(
      h("h2", null, "Итого за день"),
      h("div", { class: "thick" }),
      row("", "Калории", t.kcal, g.kcal, "ккал", "kcal", true),
      row("", "Белок", t.p, g.p, "г", "protein", false),
      row("sub", "Жиры", t.f, g.f, "г", "", true),
      row("sub", "Углеводы", t.c, g.c, "г", "", true),
      h("p", { class: "left" },
        leftK >= 0 ? "Осталось " + fmt(leftK) + " ккал" : h("span", { class: "over" }, "Сверх цели " + fmt(-leftK) + " ккал"),
        " · ",
        leftP > 0 ? fmt(leftP, 1) + " г белка" : "белок добран"));
  }
  function renderMeals() {
    $("meals").replaceChildren.apply($("meals"), MEALS.map(function (m) {
      return h("button", { class: "meal", type: "button", "aria-pressed": S.meal === m[0], onclick: function () { S.meal = m[0]; render(); } }, m[1]);
    }));
  }
  function renderRepeat() {
    var box = $("repeat");
    box.replaceChildren();
    if (!S.loaded.days) return;
    if (dayEntries(S.date).some(function (e) { return e.meal === S.meal; })) return;
    var dates = Object.keys(S.days).filter(function (d) { return d < S.date && dayEntries(d).some(function (e) { return e.meal === S.meal; }); }).sort().reverse();
    if (!dates.length) return;
    var from = dates[0];
    var names = dayEntries(from).filter(function (e) { return e.meal === S.meal; }).map(function (e) { return e.name; });
    var mealName = MEALS.find(function (m) { return m[0] === S.meal; })[1];
    box.append(h("button", { class: "repeat", type: "button", onclick: function () { repeatMeal(from); } },
      h("b", null, mealName + " как " + (from === addDays(iso(new Date()), -1) ? "вчера" : dayTitle(from).toLowerCase())),
      h("span", null, names.join(", "))));
  }
  function foodList() {
    var q = S.q.trim().toLowerCase();
    var all = Object.keys(S.foods).map(function (id) { var f = S.foods[id]; f.id = id; return f; });
    all.sort(function (a, b) { return (b.uses || 0) - (a.uses || 0) || (b.last || 0) - (a.last || 0) || a.name.localeCompare(b.name, "ru"); });
    if (q) return all.filter(function (f) { return (f.name + " " + (f.portion || "")).toLowerCase().indexOf(q) >= 0; });
    return all;
  }
  function renderChips() {
    var chips = $("chips"), more = $("more");
    more.replaceChildren();
    if (!S.loaded.foods) { chips.replaceChildren(h("div", { class: "empty" }, "Загружаю ваши продукты…")); return; }
    var list = foodList();
    if (!Object.keys(S.foods).length) {
      chips.replaceChildren(h("div", { class: "empty" }, "Здесь появятся продукты, которые вы едите чаще всего. Нажмите «Новое», чтобы добавить первый."));
      return;
    }
    if (!list.length) {
      chips.replaceChildren(h("div", { class: "empty" }, "Ничего не найдено. ",
        h("button", { class: "more", type: "button", onclick: function () { openFood(null, S.q.trim()); } }, "Добавить «" + S.q.trim() + "»")));
      return;
    }
    var limit = 12, shown = (!S.q && !S.showAll) ? list.slice(0, limit) : list;
    var inMeal = {};
    dayEntries(S.date).forEach(function (e) { if (e.meal === S.meal) inMeal[e.foodId] = e.qty; });
    chips.replaceChildren.apply(chips, shown.map(function (f) {
      return h("button", { class: "chip", type: "button", onclick: function () { S.edit ? openFood(f.id) : addFood(f.id, 1); } },
        h("span", { class: "n" }, f.name),
        f.portion ? h("span", { class: "p" }, f.portion) : null,
        h("span", { class: "m num" }, fmt(f.kcal) + " ккал · ", h("b", null, "Б " + fmt(f.p, 1))),
        S.edit ? h("span", { class: "pen", "aria-hidden": "true" }, "✎") : (inMeal[f.id] ? h("span", { class: "badge num" }, "×" + fmt(inMeal[f.id], 1)) : null));
    }));
    if (!S.q && list.length > limit) {
      more.append(h("button", { class: "more", type: "button", onclick: function () { S.showAll = !S.showAll; renderChips(); } },
        S.showAll ? "Показать только частые" : "Показать все (" + list.length + ")"));
    }
  }
  function renderLog() {
    var log = $("log"), list = dayEntries(S.date);
    log.replaceChildren.apply(log, MEALS.map(function (m) {
      var es = list.filter(function (e) { return e.meal === m[0]; });
      var t = totals(es);
      return h("div", { class: "mealblock" },
        h("header", null, h("b", null, m[1]), h("span", { class: "num" }, es.length ? fmt(t.kcal) + " ккал · Б " + fmt(t.p, 1) + " г" : "пусто")),
        es.length ? es.map(function (e) {
          return h("div", { class: "entry" },
            h("div", { class: "t" }, e.name, h("small", { class: "num" }, (e.portion ? e.portion + " · " : "") + fmt(e.kcal * e.qty) + " ккал · Б " + fmt(e.p * e.qty, 1) + " г")),
            h("div", { class: "s" },
              h("button", { type: "button", "aria-label": e.qty <= 0.5 ? "Удалить" : "Меньше", onclick: function () { changeQty(e.id, -0.5); } }, e.qty <= 0.5 ? "×" : "−"),
              h("output", { class: "num" }, fmt(e.qty, 1)),
              h("button", { type: "button", "aria-label": "Больше", onclick: function () { changeQty(e.id, 0.5); } }, "+")));
        }) : h("div", { class: "empty-meal" }, "Ничего не добавлено"));
    }));
  }
  function renderWeek() {
    var w = $("week"), today = iso(new Date()), cells = [];
    for (var i = 6; i >= 0; i--) {
      (function (date) {
        var t = totals(dayEntries(date)), g = S.targets, ratio = g.kcal ? t.kcal / g.kcal : 0;
        var d = parse(date);
        cells.push(h("button", { class: "day", type: "button", "aria-pressed": date === S.date, onclick: function () { S.date = date; render(); }, "aria-label": dayTitle(date) },
          h("span", { class: "bar" }, h("i", { class: ratio > 1 ? "over" : "", style: "height:" + Math.min(100, ratio * 100) * 0.9 + "%" })),
          h("span", { class: "k num" }, t.kcal ? fmt(t.kcal) : "–"),
          h("span", { class: "pr num" }, t.p ? "Б " + fmt(t.p) : " "),
          h("span", { class: "w" }, date === today ? "сег" : WD[d.getDay()])));
      })(addDays(today, -i));
    }
    w.replaceChildren.apply(w, cells);
  }
  function render() {
    renderHead(); renderSummary(); renderMeals(); renderRepeat(); renderChips(); renderLog(); renderWeek();
    $("btn-edit").setAttribute("aria-pressed", S.edit);
    $("btn-edit").textContent = S.edit ? "Готово" : "Править";
    if (S.error && $("toast").hidden) toast(S.error);
  }

  /* ---------- окна ввода ---------- */
  function closeSheet() { $("sheet").hidden = true; $("sheet").replaceChildren(); }
  function field(id, label, value, opts) {
    opts = opts || {};
    return h("div", { class: "field" + (opts.wide ? " wide" : "") },
      h("label", { for: id }, label),
      h("input", { id: id, type: "text", value: value == null ? "" : value, inputmode: opts.text ? "text" : "decimal", autocomplete: "off" }));
  }
  function openSheet(panel) {
    var s = $("sheet");
    s.replaceChildren(panel);
    s.hidden = false;
    var first = panel.querySelector("input"); if (first) first.focus();
  }
  function openFood(id, prefill) {
    var f = id ? S.foods[id] : null;
    var armed = false;
    var panel = h("form", { class: "panel", onsubmit: function (ev) {
      ev.preventDefault();
      var name = $("fn").value.trim();
      if (!name) { $("fn").focus(); return; }
      var data = { name: name, portion: $("fp").value.trim(), kcal: num($("fk").value), p: num($("fb").value), f: num($("ff").value), c: num($("fc").value),
                   uses: f ? (f.uses || 0) : 0, last: f ? (f.last || 0) : 0 };
      var fid = id || ("f" + uid());
      S.foods[fid] = data; persist("foods/" + fid); closeSheet();
      if (!id) { addFood(fid, 1); } else {
        // обновить название и значения в записях сегодняшнего дня не нужно: журнал хранит снимок
        render();
      }
    } },
      h("h2", null, f ? "Изменить продукт" : "Новый продукт"),
      h("div", { class: "fields" },
        field("fn", "Название", f ? f.name : (prefill || ""), { wide: true, text: true }),
        field("fp", "Порция (например, 180 г или 1 шт)", f ? f.portion : "", { wide: true, text: true }),
        field("fk", "Ккал на порцию", f ? f.kcal : ""),
        field("fb", "Белок, г", f ? f.p : ""),
        field("ff", "Жиры, г", f ? f.f : ""),
        field("fc", "Углеводы, г", f ? f.c : "")),
      h("p", { class: "note" }, "Значения указаны на одну порцию. В журнале её можно умножить на 0,5; 1; 1,5 и так далее."),
      h("div", { class: "actions" },
        h("button", { class: "primary", type: "submit" }, f ? "Сохранить" : "Сохранить и добавить"),
        h("button", { class: "plain", type: "button", onclick: closeSheet }, "Отмена"),
        f ? h("button", { class: "danger", type: "button", onclick: function (ev) {
          if (!armed) { armed = true; ev.target.textContent = "Точно удалить?"; return; }
          delete S.foods[id]; persist("foods/" + id); closeSheet(); render();
        } }, "Удалить") : null));
    openSheet(panel);
  }
  function openTargets() {
    var g = S.targets;
    var panel = h("form", { class: "panel", onsubmit: function (ev) {
      ev.preventDefault();
      S.targets = { kcal: num($("tk").value) || DEF_T.kcal, p: num($("tp").value) || DEF_T.p, f: num($("tf").value) || DEF_T.f, c: num($("tc").value) || DEF_T.c };
      persist("settings/targets"); closeSheet(); render();
    } },
      h("h2", null, "Цели на день"),
      h("div", { class: "fields" },
        field("tk", "Ккал", g.kcal), field("tp", "Белок, г", g.p), field("tf", "Жиры, г", g.f), field("tc", "Углеводы, г", g.c)),
      h("p", { class: "note" }, "Стартовые цели из чата: 2 200 ккал и 135 г белка. После двух недель их стоит пересмотреть по весу и талии."),
      window.__localDb ? h("div", { class: "field wide", style: "margin-top:14px" },
        h("label", { for: "bk" }, "Копия данных (записи хранятся только в этом браузере)"),
        h("textarea", { id: "bk", rows: "3", placeholder: "Нажмите «Скопировать данные» и сохраните текст в заметках. Чтобы вернуть, вставьте его сюда и нажмите «Восстановить»." }),
        h("div", { class: "actions" },
          h("button", { class: "plain", type: "button", onclick: function () {
            var t = window.__localDb.exportJSON(), ta = $("bk"); ta.value = t; ta.select();
            try { navigator.clipboard.writeText(t).catch(function () {}); } catch (e) {}
          } }, "Скопировать данные"),
          h("button", { class: "plain", type: "button", onclick: function () {
            if (window.__localDb.importJSON($("bk").value)) location.reload(); else $("bk").setCustomValidity("Не похоже на копию");
          } }, "Восстановить"))) : null,
      h("div", { class: "actions" },
        h("button", { class: "primary", type: "submit" }, "Сохранить"),
        h("button", { class: "plain", type: "button", onclick: closeSheet }, "Отмена")));
    openSheet(panel);
  }

  /* ---------- подписки ---------- */
  async function start() {
    render();
    var claude = window.claude;
    db = window.__localDb || (claude && claude.use ? await claude.use("db") : null);
    if (!db) {
      S.loaded.foods = S.loaded.days = true;
      $("chips").replaceChildren(h("div", { class: "empty" }, "Хранилище недоступно. Откройте страницу из Claude под своей учётной записью, чтобы журнал сохранялся."));
      return;
    }
    var onErr = function () { S.error = "Связь с хранилищем потеряна. Обновите страницу."; render(); };
    db.collection("foods").onSnapshot(function (snap) {
      var m = {};
      snap.docs.forEach(function (d) {
        var k = "foods/" + d.id;
        if (busy(k)) { if (S.foods[d.id]) m[d.id] = S.foods[d.id]; } else m[d.id] = clone(d.data());
      });
      Object.keys(S.foods).forEach(function (id) { if (!m[id] && busy("foods/" + id)) m[id] = S.foods[id]; });
      S.foods = m; S.loaded.foods = true; render();
    }, onErr);
    db.collection("days").orderBy("date", "desc").limit(60).onSnapshot(function (snap) {
      var m = {};
      snap.docs.forEach(function (d) {
        var k = "days/" + d.id;
        if (busy(k)) m[d.id] = S.days[d.id] || []; else m[d.id] = clone(d.data().entries || []);
      });
      Object.keys(S.days).forEach(function (id) { if (!(id in m) && busy("days/" + id)) m[id] = S.days[id]; });
      S.days = m; S.loaded.days = true; render();
    }, onErr);
    db.doc("settings/targets").onSnapshot(function (snap) {
      if (busy("settings/targets")) return;
      if (snap.exists) { var d = snap.data(); S.targets = { kcal: d.kcal || DEF_T.kcal, p: d.p || DEF_T.p, f: d.f || DEF_T.f, c: d.c || DEF_T.c }; render(); }
    }, onErr);
  }

  $("prev").addEventListener("click", function () { S.date = addDays(S.date, -1); render(); });
  $("next").addEventListener("click", function () { if (S.date < iso(new Date())) { S.date = addDays(S.date, 1); render(); } });
  $("btn-new").addEventListener("click", function () { openFood(null, S.q.trim()); });
  $("btn-edit").addEventListener("click", function () { S.edit = !S.edit; renderChips(); $("btn-edit").setAttribute("aria-pressed", S.edit); $("btn-edit").textContent = S.edit ? "Готово" : "Править"; });
  $("btn-targets").addEventListener("click", openTargets);
  $("search").addEventListener("input", function (e) { S.q = e.target.value; renderChips(); });
  $("sheet").addEventListener("click", function (e) { if (e.target === $("sheet")) closeSheet(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !$("sheet").hidden) closeSheet(); });
  start();
})();
</script>
</body>
</html>
