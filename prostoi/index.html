<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f6f3ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15171a" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="apple-mobile-web-app-title" content="Простои">
<link rel="apple-touch-icon" href="/MPK/apple-touch-icon.png?v=3">
<title>Простои ЦРП</title>
<style>
:root{
  --bg:#f6f3ee;--card:#fff;--ink:#1f2933;--mute:#6b7280;--line:#e7e2d9;--soft:#f1ede6;
  --run:#1f8a5b;--run-bg:#e6f4ec;--stop:#d9482b;--stop-bg:#fdece7;--on:#fff;
  --shadow:0 1px 2px rgba(31,41,51,.06),0 6px 18px rgba(31,41,51,.06);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#15171a;--card:#1f2227;--ink:#f1f2f4;--mute:#9aa1ab;--line:#2f343b;--soft:#272b31;
  --run:#4cc38a;--run-bg:#16291f;--stop:#ff7a59;--stop-bg:#33201b;--on:#0f1114;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans","Noto Sans KR","Malgun Gothic",Arial,sans-serif;padding:env(safe-area-inset-top) 16px calc(28px + env(safe-area-inset-bottom))}
.wrap{max-width:520px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 0 12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
h1{font-size:21px;font-weight:700;margin:0;letter-spacing:-.2px}
.clock{display:flex;align-items:center;gap:6px;background:var(--card);border-radius:999px;padding:7px 12px;box-shadow:var(--shadow);font-variant-numeric:tabular-nums;font-weight:600;font-size:15px;color:var(--mute)}
.demo{background:var(--soft);border-radius:12px;padding:10px 14px;font-size:14px;color:var(--mute);margin-bottom:12px}
.lines{display:grid;gap:10px;margin:4px 0 14px}
.lines button{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:10px 12px;border-radius:16px;border:2px solid transparent;background:var(--card);color:var(--ink);font-weight:650;font-size:17px;font-family:inherit;box-shadow:var(--shadow);transition:transform .12s}
.lines button:active{transform:scale(.97)}
.lines button.sel{border-color:var(--ink)}
.lines .dot{width:10px;height:10px;border-radius:50%;background:var(--run);flex:none}
.lines button.down .dot{background:var(--stop)}
.lines button.down{background:var(--stop-bg)}
.lines small{display:none;font-weight:600;font-size:13px;color:var(--stop)}
.lines button.down small{display:inline}
.card{background:var(--card);border-radius:24px;padding:20px;margin-bottom:14px;box-shadow:var(--shadow);animation:rise .25s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card.run{background:var(--run-bg)}
.card.down{background:var(--stop-bg)}
.state{display:flex;align-items:center;gap:10px;margin:0 0 14px;font-weight:600;font-size:17px}
.pulse{width:12px;height:12px;border-radius:50%;background:var(--run);position:relative;flex:none}
.pulse::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid var(--run);opacity:0;animation:ping 2s ease-out infinite}
.pulse.red{background:var(--stop)}
.pulse.red::after{border-color:var(--stop)}
@keyframes ping{0%{opacity:.6;transform:scale(.6)}100%{opacity:0;transform:scale(1.5)}}
.big{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;min-height:92px;padding:18px 14px;border-radius:22px;border:0;font-weight:750;font-size:21px;line-height:1.15;font-family:inherit;color:var(--on);margin-top:4px;transition:transform .12s,filter .12s}
.big.stop{background:var(--stop);color:#fff}
.big.on{background:var(--run);color:var(--on);box-shadow:0 0 0 4px rgba(31,138,91,.22),0 8px 26px rgba(31,138,91,.55);animation:glow 2.2s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 0 4px rgba(31,138,91,.22),0 8px 26px rgba(31,138,91,.45)}50%{box-shadow:0 0 0 8px rgba(31,138,91,.14),0 10px 34px rgba(31,138,91,.7)}}
.big.go{background:var(--run);color:#fff;margin-top:10px}
.big:active{transform:scale(.98);filter:brightness(.94)}
.sub{color:var(--mute);font-size:15px;margin:0 0 6px}
h2{font-size:19px;font-weight:700;margin:0 0 14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:96px;padding:14px 8px;border-radius:18px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-weight:600;font-size:16.5px;line-height:1.2;font-family:inherit;text-align:center;transition:transform .12s,background .12s,border-color .12s}
.grid button:active{transform:scale(.97);background:var(--stop-bg);border-color:var(--stop)}
.grid .wide{grid-column:1/-1;min-height:72px;flex-direction:row;gap:12px}
.link{display:flex;align-items:center;justify-content:center;gap:6px;background:none;border:0;color:var(--mute);font:inherit;font-size:16px;padding:14px 0 2px;width:100%}
.timer{font-size:64px;line-height:1.05;font-weight:750;font-variant-numeric:tabular-nums;color:var(--stop);margin:0 0 10px;letter-spacing:-1.5px}
.cause{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:16px;padding:12px 14px;margin:0 0 12px;font-weight:650}
.chips{display:flex;gap:8px;margin:2px 0 14px}
.chips button{flex:1;min-height:48px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:600;transition:transform .12s}
.chips button:active{transform:scale(.97)}
input[type=text]{width:100%;min-height:50px;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;margin:0 0 6px;outline:none}
input[type=text]:focus{border-color:var(--ink)}
.sum{display:flex;gap:10px;margin-bottom:12px}
.sum div{flex:1;background:var(--soft);border-radius:18px;padding:12px 14px}
.sum b{display:block;font-size:28px;line-height:1.1;font-weight:750;font-variant-numeric:tabular-nums}
.sum span{font-size:14px;color:var(--mute)}
table{width:100%;border-collapse:separate;border-spacing:0 6px;font-size:15px}
td,th{padding:10px 8px;text-align:left;vertical-align:top}
th{font-size:13px;color:var(--mute);font-weight:600;padding:0 8px}
td{background:var(--soft)}
td:first-child{border-radius:12px 0 0 12px}
td:last-child{border-radius:0 12px 12px 0}
td.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:700}
td.sub,td[colspan]{background:none;padding-left:0}
.card.today h2{margin-bottom:12px}
#toast{position:fixed;left:16px;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));max-width:488px;margin:0 auto;display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--bg);padding:15px 18px;border-radius:18px;box-shadow:var(--shadow);opacity:0;transform:translateY(14px);transition:.25s;pointer-events:none;z-index:9;font-weight:600}
#toast.on{opacity:1;transform:none}
.foot{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--mute);margin:4px 4px 0}
.foot .link{width:auto;padding:6px 0;font-size:14px;text-decoration:underline}
.hide{display:none!important}
@media (prefers-reduced-motion:reduce){*,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><h1>Простои ЦРП</h1></div>
    <div class="clock"><span id="clock"></span></div>
  </header>
  <div id="demo" class="demo hide">Пробный режим: нажатия сохраняются только на этом телефоне и никуда не отправляются.</div>
  <div id="lines" class="lines"></div>

  <div id="view"></div>

  <div class="card today">
    <h2 id="todayTitle">Сегодня</h2>
    <div class="sum"><div><b id="sCount">0</b><span>простоев</span></div><div><b id="sMin">0</b><span>минут</span></div></div>
    <table id="log"></table>
  </div>
  <div class="foot"><span id="queue"></span><button class="link" id="csv">Скачать журнал (CSV)</button></div>
</div>
<div id="toast"></div>

<script>
/* ---------- настройки ---------- */
const CONFIG = {
  // Адрес приёма ответов Google Формы (…/forms/d/e/<id>/formResponse). Пусто — пробный режим.
  endpoint: 'https://docs.google.com/forms/d/e/1FAIpQLSfj5ysxFc-l_Tc3HxupwFmwRaL7IhU4e3ub_gAkIi0QX_chNg/formResponse',
  // Номера полей формы (entry.NNNN) в том же порядке, что вопросы формы.
  fields: {line:'entry.331374885', event:'entry.1118132647', cause:'entry.2039888318', start:'entry.1457364802', end:'entry.2110158197', seconds:'entry.1673117236', shift:'entry.2031487776', shiftDate:'entry.876001012', comment:'entry.2061596686'},
  lines: ['Линия 5'],  // пока только Л5, остальные (Линия 1–4, Линия 7) добавим после тренировки; те же названия — в листе «Справочник» таблицы
  causes: ['Машина не востребована','Переналадка','Неисправность','Закончилась пленка, этикетка','Отсутствие сырья','Смена заказа','Прочее','Перерыв','Окончание работы'],  // перечень Павла от 26.10.2026, «Окончание работы» добавлено 27.10.2026; те же названия — в листе «Справочник» таблицы
  tz: 'Europe/Moscow'
};

const esc = t => String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

/* ---------- время по Москве ---------- */
const P = (d,o)=>Object.fromEntries(new Intl.DateTimeFormat('ru-RU',{timeZone:CONFIG.tz,hourCycle:'h23',...o}).formatToParts(d).map(x=>[x.type,x.value]));
const parts = d=>P(d,{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'});
const fmtDT = ms=>{const p=parts(new Date(ms));return `${p.day}.${p.month}.${p.year} ${p.hour}:${p.minute}:${p.second}`};
const fmtT = ms=>{const p=parts(new Date(ms));return `${p.hour}:${p.minute}`};
const dayKey = ms=>{const p=parts(new Date(ms));return `${p.day}.${p.month}.${p.year}`};
function shiftOf(ms){ // 1 смена 08–20, 2 смена 20–02, ночью до 08:00 относится к дате предыдущих суток
  const p=parts(new Date(ms)), h=+p.hour;
  const shift = (h>=8&&h<20)?'1 смена (08–20)':(h>=20||h<2)?'2 смена (20–02)':'Вне смен';
  let date=dayKey(ms);
  if(h<8) date=dayKey(ms-86400000);
  return {shift,date};
}
const mmss = s=>{s=Math.max(0,Math.floor(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0')};
const minutes = s=>Math.round(s/60);

/* ---------- хранилище ---------- */
const S = {
  get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
let state = S.get('down_state',{});        // линия → {start,cause,comment}
let journal = S.get('down_journal',[]);    // завершённые простои на этом телефоне
let queue = S.get('down_queue',[]);        // неотправленные строки
let selected = S.get('down_line',CONFIG.lines[0]);
if(!CONFIG.lines.includes(selected)) selected = CONFIG.lines[0];
let picking = false;                       // открыта сетка причин
const save = ()=>{S.set('down_state',state);S.set('down_journal',journal);S.set('down_queue',queue);S.set('down_line',selected)};

/* ---------- отправка в Google Форму ---------- */
function post(rec){
  const f=CONFIG.fields, sh=shiftOf(rec.endMs||rec.startMs);
  const p=new URLSearchParams();
  const put=(k,v)=>{if(f[k])p.append(f[k],v)};
  put('line',rec.line); put('event',rec.event); put('cause',rec.cause||'');
  put('start',fmtDT(rec.startMs)); put('end',rec.endMs?fmtDT(rec.endMs):'');
  put('seconds',rec.seconds!=null?String(rec.seconds):''); put('shift',sh.shift); put('shiftDate',sh.date); put('comment',rec.comment||'');
  if(!CONFIG.endpoint) return;
  queue.push(p.toString()); save(); flush();
}
let flushing=false;
async function flush(){
  if(flushing||!CONFIG.endpoint) return; flushing=true;
  while(queue.length){
    try{
      await fetch(CONFIG.endpoint,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:queue[0]});
      queue.shift(); save();
    }catch(e){break}
  }
  flushing=false; drawQueue();
}
window.addEventListener('online',flush);

/* ---------- действия ---------- */
function startDown(cause){
  state[selected]={start:Date.now(),cause,comment:''};
  picking=false; save();
  post({line:selected,event:'Остановка',cause,startMs:state[selected].start});
  render(); toast(`${selected}: остановка в ${fmtT(state[selected].start)}`);
}
function endDown(){
  const st=state[selected]; if(!st) return;
  const now=Date.now(), sec=Math.round((now-st.start)/1000);
  const rec={line:selected,cause:st.cause,comment:st.comment,startMs:st.start,endMs:now,seconds:sec};
  journal.push(rec); delete state[selected]; save();
  post({...rec,event:'Пуск'});
  render(); toast(`Записано: ${minutes(sec)} мин, ${rec.cause}`);
}
function cancelDown(){
  const st=state[selected]; if(!st) return;
  if(!confirm('Отменить эту остановку? Простой не будет засчитан.')) return;
  post({line:selected,event:'Отмена',cause:st.cause,startMs:st.start,endMs:Date.now(),seconds:0});
  delete state[selected]; save(); render(); toast('Остановка отменена');
}
function shiftStart(min){
  const st=state[selected]; if(!st) return;
  st.start-=min*60000; save(); render();
}
function changeCause(c){
  const st=state[selected]; st.cause=c; picking=false; save(); render();
}
function toast(t){const e=document.getElementById('toast');e.innerHTML='<span></span>';e.lastChild.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2600)}

/* ---------- отрисовка ---------- */
const $=id=>document.getElementById(id);
function drawLines(){
  $('lines').style.gridTemplateColumns='repeat('+Math.min(3,CONFIG.lines.length)+',1fr)';
  $('lines').innerHTML=CONFIG.lines.map(l=>{
    const d=state[l];
    return `<button data-l="${esc(l)}" class="${l===selected?'sel':''} ${d?'down':''}"><i class="dot"></i><span>${esc(CONFIG.lines.length>1?l.replace('Линия ','Л'):l)}</span><small>стоит</small></button>`;
  }).join('');
  $('lines').querySelectorAll('button').forEach(b=>b.onclick=()=>{selected=b.dataset.l;picking=false;save();render()});
}
function drawView(){
  const st=state[selected], v=$('view');
  if(picking){
    v.innerHTML=`<div class="card"><h2>${esc(selected)}: причина остановки</h2><div class="grid">${
      CONFIG.causes.map((c,i)=>`<button data-c="${esc(c)}" class="${i===CONFIG.causes.length-1&&CONFIG.causes.length%2?'wide':''}"><span>${esc(c)}</span></button>`).join('')
    }</div><button class="link" id="cancelPick">Назад</button></div>`;
    v.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>st?changeCause(b.dataset.c):startDown(b.dataset.c));
    $('cancelPick').onclick=()=>{picking=false;render()};
    return;
  }
  if(!st){
    v.innerHTML=`<div class="card run"><p class="state"><i class="pulse"></i>${esc(selected)} работает</p><button class="big on" id="stop"><span>ЛИНИЯ ОСТАНОВИЛАСЬ</span></button></div>`;
    $('stop').onclick=()=>{picking=true;render()};
    return;
  }
  v.innerHTML=`<div class="card down">
    <p class="state"><i class="pulse red"></i>${esc(selected)} стоит с ${fmtT(st.start)}</p>
    <div class="timer" id="timer">${mmss((Date.now()-st.start)/1000)}</div>
    <div class="cause"><b>${esc(st.cause)}</b></div>
    <input type="text" id="comment" placeholder="Комментарий (необязательно)" value="${esc(st.comment||'')}">
    <p class="sub" style="margin-top:14px">Забыли нажать вовремя? Сдвинуть начало раньше:</p>
    <div class="chips"><button data-s="5">−5 мин</button><button data-s="10">−10 мин</button><button data-s="30">−30 мин</button></div>
    <button class="big go" id="go"><span>ЛИНИЯ ЗАПУЩЕНА</span></button>
    <button class="link" id="chg">Изменить причину</button>
    <button class="link" id="mis">Нажали по ошибке — отменить</button>
  </div>`;
  v.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>shiftStart(+b.dataset.s));
  $('comment').oninput=e=>{st.comment=e.target.value;save()};
  $('go').onclick=endDown; $('chg').onclick=()=>{picking=true;render()}; $('mis').onclick=cancelDown;
}
function drawLog(){
  const today=dayKey(Date.now());
  const rows=journal.filter(r=>r.line===selected&&dayKey(r.endMs)===today).sort((a,b)=>b.endMs-a.endMs);
  $('todayTitle').textContent=`${selected}, сегодня`;
  $('sCount').textContent=rows.length;
  $('sMin').textContent=minutes(rows.reduce((s,r)=>s+r.seconds,0));
  $('log').innerHTML=rows.length?`<tr><th>Время</th><th>Причина</th><th class="r">Мин</th></tr>`+rows.slice(0,10).map(r=>`<tr><td>${fmtT(r.startMs)}–${fmtT(r.endMs)}</td><td>${esc(r.cause)}${r.comment?`<br><span class="sub">${esc(r.comment)}</span>`:''}</td><td class="r">${minutes(r.seconds)}</td></tr>`).join(''):'<tr><td class="sub" colspan="3">Пока без простоев</td></tr>';
}
function drawQueue(){$('queue').textContent=CONFIG.endpoint?(queue.length?`Не отправлено: ${queue.length}`:'Всё отправлено'):''}
function render(){drawLines();drawView();drawLog();drawQueue()}

/* ---------- таймеры ---------- */
setInterval(()=>{
  $('clock').textContent=fmtT(Date.now());
  const st=state[selected], t=$('timer'); if(st&&t) t.textContent=mmss((Date.now()-st.start)/1000);
},1000);

/* ---------- CSV ---------- */
$('csv').onclick=()=>{
  const head=['Линия','Причина','Начало','Конец','Секунд','Минут','Смена','Комментарий'];
  const rows=journal.map(r=>{const s=shiftOf(r.endMs);return [r.line,r.cause,fmtDT(r.startMs),fmtDT(r.endMs),r.seconds,(r.seconds/60).toFixed(1).replace('.',','),s.shift,r.comment||'']});
  const csv='﻿'+[head,...rows].map(r=>r.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(';')).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='простои.csv';a.click();
};

if(!CONFIG.endpoint) $('demo').classList.remove('hide');
$('clock').textContent=fmtT(Date.now());
render(); flush();
</script>
</body>
</html>
