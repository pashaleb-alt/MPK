<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#2f52a3">
<link rel="manifest" href="/MPK/train/manifest.webmanifest">
<link rel="apple-touch-icon" href="/MPK/train/apple-touch-icon.png?v=1">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Трен"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>:root{color-scheme:light dark}html,body{margin:0}[hidden]{display:none!important}</style>
<title>Дневник тренировок</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Раскладка: одна колонка, как этикетка продукта. Сверху итог дня,
   ниже выбор приёма пищи, плитки частых продуктов и журнал дня. */
:root {
  --bg: #eef1ea;
  --surface: #fbfcf8;
  --ink: #17201b;
  --muted: #5b675f;
  --line: #d2d9cd;
  --protein: #1e7a4c;
  --kcal: #2f52a3;
  --warn: #b1481a;
  --on-ink: #fbfcf8;
  --f-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1512; --surface: #172019; --ink: #e8eee7; --muted: #94a199; --line: #28352d;
    --protein: #4cc38a; --kcal: #84a6f2; --warn: #ec8f5e; --on-ink: #0f1512;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1512; --surface: #172019; --ink: #e8eee7; --muted: #94a199; --line: #28352d;
  --protein: #4cc38a; --kcal: #84a6f2; --warn: #ec8f5e; --on-ink: #0f1512;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.4;
  padding-block: 16px 96px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--kcal); outline-offset: 2px; }
.app { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.num { font-variant-numeric: tabular-nums; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.eyebrow { font: 700 12px/1 var(--f-display); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.ghost { background: none; border: 1.5px solid var(--ink); border-radius: 999px; padding: 8px 14px; min-height: 40px; font-weight: 500; }
.ghost[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); }

.datebar { display: grid; grid-template-columns: 48px 1fr 48px; align-items: center; gap: 8px; }
.datebar h1 { margin: 0; text-align: center; font: 800 26px/1.1 var(--f-display); text-wrap: balance; }
.datebar h1 small { display: block; margin-top: 2px; font: 500 13px var(--f-body); color: var(--muted); }
.arrow { height: 48px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); font-size: 22px; line-height: 1; }
.arrow:disabled { opacity: .35; cursor: default; }

.label { background: var(--surface); border: 2px solid var(--ink); padding: 12px 14px 14px; }
.label h2 { margin: 0 0 6px; font: 800 20px/1.1 var(--f-display); }
.label .thick { height: 7px; background: var(--ink); margin-bottom: 4px; }
.row { padding: 8px 0 7px; border-top: 1px solid var(--line); }
.row:first-of-type { border-top: 0; }
.row .head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.row .name { font-weight: 600; }
.row .val { font: 700 18px/1 var(--f-display); }
.row .val span { font: 500 13px var(--f-body); color: var(--muted); }
.row.sub .name { font-weight: 400; }
.row.sub .val { font-size: 15px; }
.track { height: 7px; background: var(--line); margin-top: 6px; }
.fill { height: 100%; background: var(--ink); }
.fill.kcal { background: var(--kcal); }
.fill.protein { background: var(--protein); }
.fill.over { background: var(--warn); }
.left { margin: 10px 0 0; font-weight: 600; }
.left .over { color: var(--warn); }

.meals { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.meal { min-height: 46px; border: 1.5px solid var(--ink); background: var(--surface); border-radius: 10px; font-weight: 600; padding: 4px; }
.meal[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); }

.repeat { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; width: 100%; min-height: 56px;
  background: var(--surface); border: 1.5px dashed var(--ink); border-radius: 10px; padding: 10px 14px; }
.repeat b { font-family: var(--f-display); }
.repeat span { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }

.picker { display: flex; flex-direction: column; gap: 10px; }
.picker-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.picker-head h2, .log h2, .week h2 { margin: 0; font: 800 18px/1.1 var(--f-display); }
.btns { display: flex; gap: 8px; }
.search { width: 100%; min-height: 46px; border: 1.5px solid var(--line); background: var(--surface); border-radius: 10px; padding: 0 14px; }
.chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.chip { position: relative; text-align: left; min-width: 0; min-height: 76px; background: var(--surface); border: 1.5px solid var(--line);
  border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; }
.chip:active { border-color: var(--ink); }
.chip .n { font-weight: 600; overflow-wrap: anywhere; line-height: 1.2; padding-right: 22px; }
.chip .p { color: var(--muted); font-size: 13px; }
.chip .m { margin-top: auto; font-size: 13px; color: var(--muted); }
.chip .m b { color: var(--protein); font-weight: 600; }
.chip .badge { position: absolute; top: 8px; right: 8px; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 11px; background: var(--ink); color: var(--on-ink); font: 700 12px/22px var(--f-display); text-align: center; }
.chip .pen { position: absolute; top: 8px; right: 10px; color: var(--muted); }
.more { background: none; border: 0; text-decoration: underline; color: var(--muted); min-height: 40px; align-self: flex-start; padding: 0; }
.empty { color: var(--muted); padding: 14px; border: 1.5px dashed var(--line); border-radius: 10px; }

.log { display: flex; flex-direction: column; gap: 14px; }
.mealblock { background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px; }
.mealblock > header { display: flex; justify-content: space-between; align-items: baseline; padding: 10px 14px; border-bottom: 1.5px solid var(--ink); }
.mealblock > header b { font: 800 16px var(--f-display); }
.mealblock > header span { font-size: 13px; color: var(--muted); }
.entry { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; padding: 10px 14px; border-top: 1px solid var(--line); align-items: center; }
.entry:first-of-type { border-top: 0; }
.entry .t { min-width: 0; overflow-wrap: anywhere; font-weight: 500; }
.entry .t small { display: block; color: var(--muted); font-weight: 400; font-size: 13px; }
.entry .s { display: inline-flex; align-items: center; border: 1.5px solid var(--line); border-radius: 10px; overflow: hidden; }
.entry .s button { width: 40px; height: 40px; border: 0; background: none; font-size: 20px; line-height: 1; }
.entry .s output { min-width: 36px; text-align: center; font: 700 15px var(--f-display); }
.empty-meal { padding: 12px 14px; color: var(--muted); font-size: 14px; }

.week { display: flex; flex-direction: column; gap: 8px; }
.days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.day { background: var(--surface); border: 1.5px solid var(--line); border-radius: 8px; padding: 6px 2px 6px; display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
.day[aria-pressed="true"] { border-color: var(--ink); border-width: 2px; }
.day .bar { width: 14px; height: 56px; background: var(--line); display: flex; align-items: flex-end; position: relative; }
.day .bar i { display: block; width: 100%; background: var(--kcal); }
.day .bar i.over { background: var(--warn); }
.day .bar::after { content: ""; position: absolute; left: -3px; right: -3px; top: 0; border-top: 1.5px solid var(--ink); }
.day .w { font-size: 12px; color: var(--muted); }
.day .k { font: 700 12px var(--f-display); }
.day .pr { font-size: 11px; color: var(--protein); }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: min(calc(100% - 32px), 420px);
  background: var(--ink); color: var(--on-ink); border-radius: 10px; padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; gap: 12px; z-index: 20; }
.toast button { background: none; border: 0; color: inherit; text-decoration: underline; font-weight: 600; min-height: 36px; }

.sheet { position: fixed; inset: 0; z-index: 30; background: rgba(10, 14, 11, .55); display: flex; align-items: flex-end; justify-content: center; }
.panel { width: 100%; max-width: 560px; max-height: 92%; overflow-y: auto; background: var(--surface); border-top: 3px solid var(--ink); border-radius: 14px 14px 0 0;
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.panel h2 { margin: 0 0 12px; font: 800 20px var(--f-display); }
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.fields .wide { grid-column: 1 / -1; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label { font-size: 13px; color: var(--muted); }
.field textarea { border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--bg); width: 100%; resize: vertical; }
.field input { min-height: 46px; border: 1.5px solid var(--line); border-radius: 10px; padding: 0 12px; background: var(--bg); width: 100%; }
.actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
.primary { flex: 1; min-height: 48px; background: var(--ink); color: var(--on-ink); border: 0; border-radius: 10px; font-weight: 600; padding: 0 16px; }
.danger { min-height: 48px; background: none; border: 1.5px solid var(--warn); color: var(--warn); border-radius: 10px; padding: 0 14px; font-weight: 600; }
.plain { min-height: 48px; background: none; border: 1.5px solid var(--line); border-radius: 10px; padding: 0 14px; }
.note { margin: 10px 0 0; font-size: 13px; color: var(--muted); }
@media (prefers-reduced-motion: no-preference) { .fill, .day .bar i { transition: width .25s, height .25s; } }

/* Тренировки: к общему оформлению добавлены фильтр групп, карточки упражнений и строки подходов */
.eyebrow a { color: inherit; }
.groups { display: flex; flex-wrap: wrap; gap: 6px; }
.grp { min-height: 40px; border: 1.5px solid var(--ink); background: var(--surface); border-radius: 999px; padding: 0 14px; font-weight: 500; }
.grp[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); }
.stat { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); }
.stat:first-of-type { border-top: 0; }
.stat .name { font-weight: 600; }
.stat .val { font: 700 18px/1 var(--f-display); }
.stat .val span { font: 500 13px var(--f-body); color: var(--muted); }
.toggle { display: inline-flex; border: 1.5px solid var(--ink); border-radius: 10px; overflow: hidden; }
.toggle button { min-width: 64px; height: 40px; border: 0; background: none; font-weight: 600; }
.toggle button[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); }
.toggle button.bad[aria-pressed="true"] { background: var(--warn); color: #fff; }
.mini { display: inline-flex; align-items: center; border: 1.5px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--bg); }
.mini button { width: 36px; height: 40px; border: 0; background: none; font-size: 18px; line-height: 1; }
.mini input { width: 52px; height: 40px; border: 0; border-left: 1px solid var(--line); border-right: 1px solid var(--line); text-align: center; background: var(--surface); font: 700 15px var(--f-display); border-radius: 0; padding: 0; }
.note-in { width: 100%; min-height: 44px; border: 1.5px solid var(--line); background: var(--bg); border-radius: 10px; padding: 0 12px; margin-top: 8px; }
.xcard { background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px; }
.xcard > header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; padding: 10px 14px; border-bottom: 1.5px solid var(--ink); }
.xcard > header b { font: 800 16px/1.2 var(--f-display); overflow-wrap: anywhere; }
.xcard > header small { display: block; color: var(--muted); font: 400 13px var(--f-body); }
.xcard .rm { flex: none; width: 40px; height: 40px; border: 1.5px solid var(--line); background: none; border-radius: 10px; font-size: 18px; }
.setrow { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 6px 8px; padding: 8px 14px; border-top: 1px solid var(--line); }
.setrow:first-of-type { border-top: 0; }
.setrow .n { width: 20px; color: var(--muted); font: 700 14px var(--f-display); }
.setrow .x { color: var(--muted); }
.setrow .del { width: 36px; height: 40px; border: 0; background: none; color: var(--muted); font-size: 18px; }
.addset { margin: 4px 14px 12px; }
.sub { font-size: 13px; color: var(--muted); }
.groupsel { display: flex; flex-wrap: wrap; gap: 6px; }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="top">
    <span class="eyebrow">Дневник тренировок · <a href="../food/">Еда →</a></span>
  </div>
  <div class="datebar">
    <button class="arrow" id="prev" type="button" aria-label="Предыдущий день">‹</button>
    <h1 id="dlabel">…</h1>
    <button class="arrow" id="next" type="button" aria-label="Следующий день">›</button>
  </div>
  <section class="label" id="summary" aria-live="polite"></section>
  <div id="repeat"></div>
  <section class="picker">
    <div class="picker-head">
      <h2>Упражнения</h2>
      <div class="btns">
        <button class="ghost" id="btn-edit" type="button" aria-pressed="false">Править</button>
        <button class="ghost" id="btn-new" type="button">Новое</button>
      </div>
    </div>
    <div class="groups" id="groups" role="group" aria-label="Группа мышц"></div>
    <input class="search" id="search" type="search" placeholder="Найти упражнение" autocomplete="off" aria-label="Найти упражнение">
    <div class="chips" id="chips"></div>
  </section>
  <section class="log"><h2>Тренировка дня</h2><div id="log" style="display:flex;flex-direction:column;gap:14px"></div></section>
  <section class="week"><h2>Последние 7 дней</h2><div class="days" id="week"></div></section>
  <p class="sub" id="backup-note"><button class="more" id="btn-backup" type="button">Копия данных</button></p>
</div>
<div class="toast" id="toast" hidden></div>
<div class="sheet" id="sheet" hidden></div>

<script>
/* Локальная замена базы артефакта: тот же интерфейс (doc/collection/onSnapshot/set/delete),
   записи лежат в localStorage этого браузера. Подключается только в версии для GitHub Pages. */
(function () {
  var KEY = "trening-v1";
  var SEED = {"exercises/razved_gant": {"name": "Разведение рук с гантелями", "group": "Грудь", "uses": 3, "last": 1}, "exercises/svedenie_blok": {"name": "Сведение рук на блоке стоя", "group": "Грудь", "uses": 3, "last": 1}, "exercises/db_press_neutral": {"name": "Жим гантелей лёжа нейтральным хватом", "group": "Грудь", "uses": 0, "last": 1}, "exercises/tyaga_sverhu": {"name": "Тяга блока сидя узкой ручкой сверху к груди", "group": "Спина", "uses": 3, "last": 1}, "exercises/tyaga_pered": {"name": "Тяга блока сидя узкой ручкой спереди к груди", "group": "Спина", "uses": 3, "last": 1}, "exercises/vert_tyaga": {"name": "Вертикальная тяга блока", "group": "Спина", "uses": 0, "last": 1}, "exercises/gor_tyaga": {"name": "Горизонтальная тяга блока", "group": "Спина", "uses": 0, "last": 1}, "exercises/one_arm_row": {"name": "Тяга одной рукой на блоке", "group": "Спина", "uses": 0, "last": 1}, "exercises/podem_sidya": {"name": "Подъём рук с гантелями сидя со скамьи вверх", "group": "Плечи", "uses": 3, "last": 1}, "exercises/razved_stoya": {"name": "Разведение рук в стороны стоя", "group": "Плечи", "uses": 3, "last": 1}, "exercises/lateral": {"name": "Подъём гантелей через стороны", "group": "Плечи", "uses": 0, "last": 1}, "exercises/rev_fly": {"name": "Обратная бабочка", "group": "Плечи", "uses": 0, "last": 1}, "exercises/face_pull": {"name": "Face Pull", "group": "Плечи", "uses": 0, "last": 1}, "exercises/bicep_ez": {"name": "Сгибание рук на блоке кривым грифом, обратный хват", "group": "Руки", "uses": 3, "last": 1}, "exercises/bicep_pryamoy": {"name": "Сгибание рук на блоке прямым хватом", "group": "Руки", "uses": 3, "last": 1}, "exercises/db_curl": {"name": "Сгибание рук с гантелями", "group": "Руки", "uses": 0, "last": 1}, "exercises/tricep_blok": {"name": "Разгибание рук на блоке стоя", "group": "Руки", "uses": 3, "last": 1}, "exercises/calf": {"name": "Подъём на носки стоя со штангой на плечах", "group": "Ноги", "uses": 3, "last": 1}, "exercises/leg_press": {"name": "Жим ногами", "group": "Ноги", "uses": 0, "last": 1}, "exercises/leg_curl": {"name": "Сгибание ног в тренажёре", "group": "Ноги", "uses": 0, "last": 1}, "exercises/leg_ext": {"name": "Разгибание ног", "group": "Ноги", "uses": 0, "last": 1}, "exercises/press_molitva": {"name": "Скручивания на блоке «молитва»", "group": "Пресс", "uses": 3, "last": 1}, "exercises/rev_crunch": {"name": "Обратные скручивания", "group": "Пресс", "uses": 0, "last": 1}, "exercises/dead_bug": {"name": "Dead Bug", "group": "Пресс", "uses": 0, "last": 1}};
  var store = null;
  try { store = JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) { store = null; }
  var SEED_V = 1;
  if (!store || !store.docs) store = { docs: {} };
  if (store.seedV !== SEED_V) {
    // версия 2: справочник из чата и записи за 19–23.10.2026; свои записи дня не затираем
    Object.keys(SEED).forEach(function (k) {
      if (k.indexOf("days/") === 0) { var d = store.docs[k]; if (!d || !(d.entries || []).length) store.docs[k] = SEED[k]; }
      else if (k.indexOf("settings/") === 0) { if (!store.docs[k]) store.docs[k] = SEED[k]; }
      else store.docs[k] = SEED[k];
    });
    store.seedV = SEED_V;
    try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {}
  }
  var listeners = [];
  function save() { localStorage.setItem(KEY, JSON.stringify(store)); }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function snapDoc(id, data) { return { id: id, exists: true, data: function () { return clone(data); }, metadata: { fromCache: false, hasPendingWrites: false } }; }
  function colDocs(path, q) {
    var out = [], pre = path + "/";
    Object.keys(store.docs).forEach(function (k) {
      if (k.indexOf(pre) === 0 && k.slice(pre.length).indexOf("/") < 0) out.push(snapDoc(k.slice(pre.length), store.docs[k]));
    });
    if (q.field) out.sort(function (a, b) {
      var x = a.data()[q.field], y = b.data()[q.field];
      return (x < y ? -1 : x > y ? 1 : 0) * (q.dir === "desc" ? -1 : 1);
    });
    if (q.limit) out = out.slice(0, q.limit);
    return { docs: out, size: out.length, empty: !out.length };
  }
  function fire(l) {
    if (l.kind === "col") l.fn(colDocs(l.path, l.q));
    else l.fn(store.docs[l.path] ? snapDoc(l.path.split("/").pop(), store.docs[l.path]) : { id: l.path.split("/").pop(), exists: false, data: function () { return undefined; } });
  }
  function notify(path) {
    var parent = path.slice(0, path.lastIndexOf("/"));
    listeners.forEach(function (l) { if (l.path === path || l.path === parent) fire(l); });
  }
  function sub(l) { listeners.push(l); setTimeout(function () { fire(l); }, 0); return function () { listeners = listeners.filter(function (x) { return x !== l; }); }; }
  function query(path, q) {
    return {
      orderBy: function (f, d) { return query(path, { field: f, dir: d || "asc", limit: q.limit }); },

      var m = {};
      snap.docs.forEach(function (d) { var k = "exercises/" + d.id; if (busy(k)) { if (S.exs[d.id]) m[d.id] = S.exs[d.id]; } else m[d.id] = clone(d.data()); });
      Object.keys(S.exs).forEach(function (id) { if (!m[id] && busy("exercises/" + id)) m[id] = S.exs[id]; });
      S.exs = m; S.loaded.exs = true; render();
    }, onErr);
    db.collection("workouts").orderBy("date", "desc").limit(90).onSnapshot(function (snap) {
      var m = {};
      snap.docs.forEach(function (d) { var k = "workouts/" + d.id; if (busy(k)) m[d.id] = S.days[d.id] || emptyW(d.id); else m[d.id] = clone(d.data()); });
      Object.keys(S.days).forEach(function (id) { if (!(id in m) && busy("workouts/" + id)) m[id] = S.days[id]; });
      S.days = m; S.loaded.days = true; render();
    }, onErr);
  }

  $("prev").addEventListener("click", function () { S.date = addDays(S.date, -1); render(); });
  $("next").addEventListener("click", function () { if (S.date < iso(new Date())) { S.date = addDays(S.date, 1); render(); } });
  $("btn-new").addEventListener("click", function () { openEx(null, S.q.trim()); });
  $("btn-edit").addEventListener("click", function () { S.edit = !S.edit; renderChips(); $("btn-edit").setAttribute("aria-pressed", S.edit); $("btn-edit").textContent = S.edit ? "Готово" : "Править"; });
  $("btn-backup").addEventListener("click", openBackup);
  $("search").addEventListener("input", function (e) { S.q = e.target.value; renderChips(); });
  $("sheet").addEventListener("click", function (e) { if (e.target === $("sheet")) closeSheet(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !$("sheet").hidden) closeSheet(); });
  start();
})();
</script>
</body>
</html>
